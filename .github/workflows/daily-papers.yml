name: Daily Papers

on:
  # 北京时间每天 09:00 = UTC 01:00
  schedule:
    - cron: "0 1 * * *"
  # 允许在 Actions 页面手动触发（带可调参数）
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "回溯天数（建议 ≥ 60 以保证候选池充足）"
        required: false
        default: "60"
      en_quota:
        description: "外文期刊推送条数"
        required: false
        default: "3"
      zh_quota:
        description: "中文期刊推送条数"
        required: false
        default: "2"

# 防止并发：上一次没跑完就跳过
concurrency:
  group: daily-papers
  cancel-in-progress: false

# 必须给 GITHUB_TOKEN 写权限，否则 commit back 历史那一步会失败
permissions:
  contents: write

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取完整历史（包括 data/pushed_history.json）
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          # ====== SMTP 邮件配置 ======
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # ====== 检索参数 ======
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '60' }}
          EN_QUOTA: ${{ github.event.inputs.en_quota || '3' }}
          ZH_QUOTA: ${{ github.event.inputs.zh_quota || '2' }}
          # 可选：换成自己的邮箱，让 OpenAlex 给你更高速率
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python main.py

      - name: Upload logs & archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-papers-${{ github.run_id }}
          path: |
            logs/summary.json
            archive/
          retention-days: 30

      - name: Commit pushed history
        # 推送成功后，把更新过的历史文件 commit 回仓库
        # 下次运行 checkout 时会自动带上
        if: success()
        run: |
          git config user.name "daily-papers-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/pushed_history.json
          if git diff --cached --quiet; then
            echo "无历史变更，无需 commit"
          else
            git commit -m "chore: 更新推送历史 ($(date +%Y-%m-%d))"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::每日文献推送任务失败，请查看上方日志"
          echo "本次运行摘要："
          cat logs/summary.json || echo "summary.json 未生成"
